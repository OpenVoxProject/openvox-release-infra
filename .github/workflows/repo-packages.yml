name: Build Repo Packages

on:
  workflow_dispatch:
    inputs:
      production:
        description: 'Build packages pointing to production repos and upload to production buckets'
        required: false
        default: false
        type: boolean
      force_overwrite:
        description: 'Overwrite existing artifacts in S3'
        required: false
        default: false
        type: boolean
      platform:
        description: 'Comma-separated platforms to build (e.g. fedora-44,sles-16). Leave empty to build all.'
        required: false
        type: string

concurrency:
  group: repo-packages-${{ inputs.production && 'production' || 'test' }}
  cancel-in-progress: false

permissions:
  contents: read

env:
  AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
  AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
  FORCE_OVERWRITE: ${{ inputs.force_overwrite && 'true' || '' }}
  GPG_PRIVATE_KEY_B64: ${{ secrets.GPG_PRIVATE_KEY_B64 }}
  PRODUCTION: ${{ inputs.production && 'true' || '' }}

jobs:
  repo-packages:
    name: Build, sign, and upload repo packages
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      # Cache the Docker image as a tarball keyed on the Dockerfile hash.
      # Faster than buildx type=gha for a simple single-layer image because
      # it avoids the buildx export/import round-trip (~20s even on cache hit).
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: /tmp/release-image.tar
          key: docker-release-${{ hashFiles('Dockerfile') }}

      - name: Load or build container
        run: |
          if [[ -f /tmp/release-image.tar ]]; then
            docker load -i /tmp/release-image.tar
          else
            docker build -t release:latest .
            docker save release:latest -o /tmp/release-image.tar
          fi

      - uses: ruby/setup-ruby@8e41b362d2589a22a44c1cfa214b3c83052c195b # v1.318.0
        with:
          ruby-version: '4'
          bundler-cache: true

      - name: Build and sign
        env:
          PLATFORM: ${{ inputs.platform }}
        run: bundle exec rake repo_packages:build

      - name: Upload
        run: bundle exec rake repo_packages:upload
