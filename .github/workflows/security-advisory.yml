name: Mark Security Release

on:
  workflow_dispatch:
    inputs:
      project:
        description: 'Released package'
        required: true
        type: choice
        options:
          - openvox-agent
          - openvox-server
          - openvoxdb
          - openbolt
      version:
        description: 'Released version (e.g. 8.32.0)'
        required: true
        type: string
      advisories:
        description: 'CVE IDs and GitHub advisory links, separated by spaces or commas, e.g. CVE-2026-1234 https://github.com/OpenVoxProject/openvox/security/advisories/GHSA-xxxx-xxxx-xxxx. Nothing else is accepted. The list replaces what an earlier run recorded for this release and may be empty.'
        required: false
        type: string
      severity:
        description: 'Severity of the worst item in advisories'
        required: true
        default: Moderate
        type: choice
        options:
          - Low
          - Moderate
          - Important
          - Critical
      production:
        description: 'Update the production repos (commits state/ and pushes to main)'
        required: false
        default: false
        type: boolean

concurrency:
  group: release-${{ inputs.production && 'production' || 'test' }}
  cancel-in-progress: false

permissions:
  contents: write

env:
  ADVISORIES: ${{ inputs.advisories }}
  AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
  AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
  GIT_AUTHOR_EMAIL: 215568489+OpenVoxProjectBot@users.noreply.github.com
  GIT_AUTHOR_NAME: OpenVoxProjectBot
  GIT_COMMITTER_EMAIL: 215568489+OpenVoxProjectBot@users.noreply.github.com
  GIT_COMMITTER_NAME: OpenVoxProjectBot
  GPG_PRIVATE_KEY_B64: ${{ secrets.GPG_PRIVATE_KEY_B64 }}
  PRODUCTION: ${{ inputs.production && 'true' || '' }}
  PROJECT: ${{ inputs.project }}
  SEVERITY: ${{ inputs.severity }}
  SSH_AUTH_SOCK: /tmp/ssh_agent.sock
  VERSION: ${{ inputs.version }}

jobs:
  advisory:
    name: Write the advisory and deploy the metadata
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          token: ${{ secrets.OPENVOXBOT_COMMIT_AND_PRS }}

      - id: docker-cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: /tmp/release-image.tar
          key: docker-release-${{ hashFiles('Dockerfile') }}

      - name: Load or build container
        run: |
          if [[ -f /tmp/release-image.tar ]]; then
            docker load -i /tmp/release-image.tar
          else
            docker build -t release:latest .
            docker save release:latest -o /tmp/release-image.tar
          fi

      - uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        if: always() && steps.docker-cache.outputs.cache-hit != 'true'
        with:
          path: /tmp/release-image.tar
          key: docker-release-${{ hashFiles('Dockerfile') }}

      - name: Add SSH key
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.OPENVOXBOT_SSH_PRIVATE_KEY }}" > ~/.ssh/github_actions
          chmod 600 ~/.ssh/github_actions
          ssh-agent -a $SSH_AUTH_SOCK > /dev/null
          ssh-add ~/.ssh/github_actions

      - name: Setup git
        run: |
          git config --global user.email "$GIT_AUTHOR_EMAIL"
          git config --global user.name "$GIT_AUTHOR_NAME"
          git config --global gpg.format ssh
          git config --global user.signingkey ~/.ssh/github_actions
          git config --global commit.gpgsign true

      - uses: ruby/setup-ruby@7f797815d8adceb1c412e7abefdd1ab4abc47a5f # v1.335.0
        with:
          ruby-version: '4'
          bundler-cache: true

      - name: Write advisory
        run: bundle exec rake advisory

      - name: Push state
        if: inputs.production
        uses: ./.github/actions/push-main

      - name: Deploy
        run: bundle exec rake deploy

      - name: Verify
        run: bundle exec rake verify_advisory
