name: Disaster Recovery (Restore from GCS)

on:
  workflow_dispatch:
    inputs:
      timestamp:
        description: 'Point-in-time to restore GCS bucket to (RFC 3339, e.g. 2026-04-15T13:30:00-07:00). Leave empty to restore current GCS state as-is.'
        required: false
        type: string
      target:
        description: 'What to restore'
        required: true
        default: 'all'
        type: choice
        options:
          - all
          - apt
          - yum
          - downloads
      production:
        description: 'Type "I want to restore to production" to restore to production S3 buckets. Otherwise, leave blank to restore to the test repo.'
        required: false
        type: string
      source_production_backup:
        description: 'Use the production GCS backup as source (for testing restore to test buckets). When left unchecked, will use the default (production backup when restoring to production, test backup when restoring to test).'
        required: false
        default: false
        type: boolean

permissions:
  contents: read
  id-token: write

env:
  AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
  AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
  CONFIRM_RESTORE: ${{ inputs.production == 'I want to restore to production' || inputs.production == '' && 'true' || '' }}
  GCS_SOURCE: ${{ inputs.source_production_backup && 'gs://openvox-backup' || '' }}
  PRODUCTION: ${{ inputs.production == 'I want to restore to production' && 'true' || '' }}
  TARGET: ${{ inputs.target }}

jobs:
  restore:
    name: Restore S3 from GCS backup
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - uses: ruby/setup-ruby@8e41b362d2589a22a44c1cfa214b3c83052c195b # v1.318.0
        with:
          ruby-version: '4'
          bundler-cache: true

      - uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3.0.0
        with:
          workload_identity_provider: projects/353991846409/locations/global/workloadIdentityPools/github-actions/providers/github
          service_account: openvox-backup@openvox.iam.gserviceaccount.com

      - name: Restore GCS bucket to point in time
        if: inputs.timestamp != ''
        env:
          TIMESTAMP: ${{ inputs.timestamp }}
        run: bundle exec rake restore:gcs

      - name: Restore S3 from GCS
        run: bundle exec rake restore
