name: Add New Repo Package Platform

on:
  workflow_dispatch:
    inputs:
      component:
        description: 'Repo component (e.g. openvox7, openvox8)'
        required: true
        type: string
      platform:
        description: 'Comma-separated platform(s) (e.g. el-9,debian13,sles-15). Arch suffix is stripped if provided.'
        required: true
        type: string
      build_test:
        description: 'Build and upload repo packages to test buckets'
        required: false
        default: false
        type: boolean
      build_production:
        description: 'Build and upload repo packages to production buckets'
        required: false
        default: false
        type: boolean

permissions:
  contents: read

env:
  AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
  AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
  COMPONENT: ${{ inputs.component }}
  GIT_AUTHOR_EMAIL: 215568489+OpenVoxProjectBot@users.noreply.github.com
  GIT_AUTHOR_NAME: OpenVoxProjectBot
  GIT_COMMITTER_EMAIL: 215568489+OpenVoxProjectBot@users.noreply.github.com
  GIT_COMMITTER_NAME: OpenVoxProjectBot
  GPG_PRIVATE_KEY_B64: ${{ secrets.GPG_PRIVATE_KEY_B64 }}
  PLATFORM: ${{ inputs.platform }}
  SSH_AUTH_SOCK: /tmp/ssh_agent.sock

jobs:
  add-platform:
    name: Add platform and push to main
    permissions:
      contents: write
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 0
          token: ${{ secrets.OPENVOXBOT_COMMIT_AND_PRS }}
      
      - uses: ruby/setup-ruby@a30dfa457ad68707b8b910ac3a244714b61c0626 # v1.320.0
        with:
          ruby-version: '4'
          bundler-cache: true

      - name: Add SSH key
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.OPENVOXBOT_SSH_PRIVATE_KEY }}" > ~/.ssh/github_actions
          chmod 600 ~/.ssh/github_actions
          ssh-agent -a $SSH_AUTH_SOCK > /dev/null
          ssh-add ~/.ssh/github_actions

      - name: Setup git
        run: |
          git config --global user.email "$GIT_AUTHOR_EMAIL"
          git config --global user.name "$GIT_AUTHOR_NAME"
          git config --global gpg.format ssh
          git config --global user.signingkey ~/.ssh/github_actions
          git config --global commit.gpgsign true

      - name: Add platform
        run: bundle exec rake repo_packages:add_platform

      - name: Push to main
        run: git push

  build-test:
    name: Build and upload to test
    needs: add-platform
    if: inputs.build_test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: main

      # Cache the Docker image as a tarball keyed on the Dockerfile hash.
      # Faster than buildx type=gha for a simple single-layer image because
      # it avoids the buildx export/import round-trip (~20s even on cache hit).
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: /tmp/release-image.tar
          key: docker-release-${{ hashFiles('Dockerfile') }}

      - name: Load or build container
        run: |
          if [[ -f /tmp/release-image.tar ]]; then
            docker load -i /tmp/release-image.tar
          else
            docker build -t release:latest .
            docker save release:latest -o /tmp/release-image.tar
          fi

      - uses: ruby/setup-ruby@a30dfa457ad68707b8b910ac3a244714b61c0626 # v1.320.0
        with:
          ruby-version: '4'
          bundler-cache: true

      - name: Build and sign
        run: bundle exec rake repo_packages:build

      - name: Upload
        run: bundle exec rake repo_packages:upload

  build-production:
    name: Build and upload to production
    needs: add-platform
    if: inputs.build_production
    runs-on: ubuntu-latest
    env:
      PRODUCTION: 'true'
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: main

      # See build-test job for explanation of this caching approach.
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: /tmp/release-image.tar
          key: docker-release-${{ hashFiles('Dockerfile') }}

      - name: Load or build container
        run: |
          if [[ -f /tmp/release-image.tar ]]; then
            docker load -i /tmp/release-image.tar
          else
            docker build -t release:latest .
            docker save release:latest -o /tmp/release-image.tar
          fi

      - uses: ruby/setup-ruby@a30dfa457ad68707b8b910ac3a244714b61c0626 # v1.320.0
        with:
          ruby-version: '4'
          bundler-cache: true

      - name: Build and sign
        run: bundle exec rake repo_packages:build

      - name: Upload
        run: bundle exec rake repo_packages:upload
