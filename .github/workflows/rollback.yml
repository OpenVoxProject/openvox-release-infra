name: Rollback

on:
  workflow_dispatch:
    inputs:
      commit:
        description: 'Git SHA to roll back state/ to'
        required: true
        type: string
      cleanup:
        description: 'Remove orphaned packages from S3 after rollback'
        required: false
        default: true
        type: boolean
      production:
        description: 'Deploy to production (commits state/ and pushes to main)'
        required: false
        default: false
        type: boolean

concurrency:
  group: release-${{ inputs.production && 'production' || 'test' }}
  cancel-in-progress: false

permissions:
  contents: write

env:
  AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
  AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
  COMMIT: ${{ inputs.commit }}
  CONFIRM_CLEANUP: 'true'
  GIT_AUTHOR_EMAIL: 215568489+OpenVoxProjectBot@users.noreply.github.com
  GIT_AUTHOR_NAME: OpenVoxProjectBot
  GIT_COMMITTER_EMAIL: 215568489+OpenVoxProjectBot@users.noreply.github.com
  GIT_COMMITTER_NAME: OpenVoxProjectBot
  PRODUCTION: ${{ inputs.production && 'true' || '' }}
  SSH_AUTH_SOCK: /tmp/ssh_agent.sock

jobs:
  rollback:
    name: Rollback and deploy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          token: ${{ secrets.OPENVOXBOT_COMMIT_AND_PRS }}

      - name: Setup git and SSH signing
        uses: OpenVoxProject/shared-actions/.github/actions/setup-git-ssh-signing@3e1128b7ad72a5922c1b89418daec164707d73b2
        with:
          ssh_private_key: ${{ secrets.OPENVOXBOT_SSH_PRIVATE_KEY }}

      - uses: ruby/setup-ruby@b3aaceaef7e0ee231b499e7b5f49c03fc1d32199 # v1.338.0
        with:
          ruby-version: '4'
          bundler-cache: true

      - name: Rollback
        run: bundle exec rake rollback

      - name: Deploy
        run: bundle exec rake deploy

      - name: Push state
        if: inputs.production
        uses: ./.github/actions/push-main

      - name: Cleanup orphaned packages
        if: inputs.cleanup
        run: bundle exec rake cleanup
